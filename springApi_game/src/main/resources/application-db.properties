# Active only under the `db` profile. Re-enables the JPA/Postgres tier that the
# default profile switches off, and points it at a local Postgres.
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=db
#
# Clearing spring.autoconfigure.exclude cancels the exclusions from
# application.properties so DataSource + JPA autoconfigure normally again.
spring.autoconfigure.exclude=

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
