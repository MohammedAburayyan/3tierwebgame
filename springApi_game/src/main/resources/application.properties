spring.application.name=springexample

# By default the app boots with NO database — the game engine is fully in-memory,
# so `mvnw spring-boot:run` works with nothing else installed. The JPA/Postgres
# tier is opt-in via the `db` profile (see application-db.properties), which clears
# these exclusions and supplies the datasource.
#
#   Run with Postgres:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=db
#   or:                 SPRING_PROFILES_ACTIVE=db java -jar target/springexample-*.jar
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
